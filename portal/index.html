<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal za dokumenta | Pobedi izvrsitelja</title><style>:root{--ink:#08131c;--muted:#607080;--gold:#d9a441;--line:#dbe3e9;--red:#c93636}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#08131c 0 35%,#102431 70%,#f7f9fb 70%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(940px,calc(100% - 28px));margin:28px auto}.panel,.case{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 14px 34px #08131c22;margin-bottom:18px}header{color:#fff;margin-bottom:18px}header strong{letter-spacing:.1em}h1,h2,h3{margin:0 0 10px}label{display:block;font-weight:700;margin:10px 0 5px}input{width:100%;padding:12px;border:1px solid #b8c5cf;border-radius:10px;font:inherit}button,a.button{display:inline-block;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.primary{background:#0f607e;color:#fff}.gold{background:var(--gold);color:#08131c}.ghost{background:#eef3f6;color:#08131c}.danger{background:#c93636;color:#fff}.muted{color:var(--muted)}.hidden{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.status{padding:12px;border-radius:10px;background:#e6f5e9;color:#145b24;margin-top:12px}.error{background:#ffe7e7;color:#8a1e1e}.doc{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.doc:first-child{border-top:0}.small{font-size:13px}@media(max-width:650px){main{width:min(100% - 16px,940px);margin:12px auto}.panel,.case{padding:16px}.doc{align-items:flex-start;flex-direction:column}}</style></head><body><main><header><strong>POMOC KOD IZVRSITELJA</strong><div class="muted">Zasticeni klijentski portal LK-023</div><a href="https://www.pobediizvrsitelja.rs/" style="display:inline-block;margin-top:10px;color:#d9a441;text-decoration:none;font-weight:700">Nazad na glavni sajt</a></header><section id="login" class="panel"><h1>Prijava klijenta</h1><p class="muted">Unesite broj telefona koji ste ostavili u zahtevu i svoju lozinku.</p><form id="login-form"><label for="login-id">Telefon ili korisnicki email</label><input id="login-id" autocomplete="username" required placeholder="0631234567"><label for="login-password">Lozinka</label><input id="login-password" type="password" autocomplete="current-password" required><div class="actions"><button class="primary" type="submit">Udji u portal</button></div><div id="login-status" class="hidden"></div></form></section><section id="portal" class="hidden"><div class="panel"><div class="actions" style="justify-content:space-between"><div><h1 id="client-name">Moj portal</h1><p class="muted">Ovde mozete videti status i dokumenta svog predmeta.</p></div><button id="logout" class="danger">Odjava</button></div><div id="portal-status" class="hidden"></div></div><div id="cases"></div></section></main><script>
const SUPABASE_URL="https://ruhxyodqhgfkwvwlxaxf.supabase.co",SUPABASE_ANON_KEY="sb_publishable_kgf__jIm5xu6Exp2RT18mw_wWVpbZT3",CLIENT_ENDPOINT=SUPABASE_URL+"/functions/v1/lk023-client-portal";const $=id=>document.getElementById(id);const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));function show(target,message,error){target.className="status"+(error?" error":"");target.textContent=message;target.classList.remove("hidden")}function emailForLogin(value){const raw=String(value||"").trim().toLowerCase();if(raw.includes("@"))return raw;let digits=raw.replace(/[^0-9]/g,"");if(digits.startsWith("00"))digits=digits.slice(2);if(digits.startsWith("0"))digits="381"+digits.slice(1);if(!digits)throw new Error("Unesite broj telefona.");return digits+"@login.lk023.invalid"}async function login(){const response=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY},body:JSON.stringify({email:emailForLogin($("login-id").value),password:$("login-password").value})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.access_token)throw new Error(data.message||data.msg||"Prijava nije uspela.");return data}async function call(action,payload={}){const session=JSON.parse(localStorage.getItem("lk023-client-session")||"null");if(!session?.access_token)throw new Error("Sesija je istekla.");const response=await fetch(CLIENT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+session.access_token},body:JSON.stringify({action,...payload})});const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw new Error(data.error||"Veza sa serverom trenutno nije uspela.");return data}function formatBytes(value){const n=Number(value||0);return n<1024*1024?Math.round(n/1024)+" KB":(n/1024/1024).toFixed(1)+" MB"}function render(data){$("client-name").textContent=data.actor?.full_name||"Moj portal";const rows=data.cases||[];$("cases").innerHTML=rows.length?rows.map(row=>'<article class="case"><h2>'+esc(row.title||"Predmet")+'</h2><p class="muted">'+esc(row.status||"status nije unet")+'</p><p>'+esc(row.description||"")+'</p><h3>Dokumenta</h3><div>'+((row.documents||[]).length?(row.documents||[]).map(doc=>'<div class="doc"><div><strong>'+esc(doc.original_name)+'</strong><div class="muted small">'+esc(doc.content_type)+" | "+formatBytes(doc.byte_size)+'</div></div>'+(doc.signed_url?'<a class="button ghost" target="_blank" rel="noopener" href="'+esc(doc.signed_url)+'">Otvori</a>':"")+"</div>").join(""):'<p class="muted">Jos nema dokumenata.</p>')+'</div><form class="upload-form" data-case-id="'+esc(row.id)+'"><label>Dodaj dokument</label><input type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required><div class="actions"><button class="gold" type="submit">Posalji dokument</button></div><div class="muted small">Dozvoljeni su PDF, slike, DOC i DOCX do 10 MB.</div></form></article>').join(""):'<div class="panel"><p class="muted">Nema dostupnih predmeta.</p></div>';document.querySelectorAll(".upload-form").forEach(form=>form.addEventListener("submit",upload))}async function load(){try{const data=await call("client-list-cases");$("login").classList.add("hidden");$("portal").classList.remove("hidden");render(data)}catch(error){localStorage.removeItem("lk023-client-session");$("portal").classList.add("hidden");$("login").classList.remove("hidden");show($("login-status"),error.message,true)}}async function upload(event){event.preventDefault();const form=event.currentTarget,file=form.querySelector("input[type=file]").files[0];if(!file)return;if(file.size>10*1024*1024){show($("portal-status"),"Dokument je veci od 10 MB.",true);return}const reader=new FileReader();reader.onload=async()=>{try{const base64=String(reader.result).split(",")[1]||"";await call("client-upload-document",{case_id:form.dataset.caseId,file_name:file.name,content_type:file.type||"application/octet-stream",content_base64:base64});show($("portal-status"),"Dokument je poslat.");await load()}catch(error){show($("portal-status"),error.message,true)}};reader.readAsDataURL(file)}$("login-form").addEventListener("submit",async event=>{event.preventDefault();$("login-status").classList.add("hidden");try{const session=await login();localStorage.setItem("lk023-client-session",JSON.stringify(session));await load()}catch(error){show($("login-status"),error.message,true)}});function consumeBrandedAccess(){const raw=location.hash.startsWith("#")?location.hash.slice(1):"";if(!raw)return false;const params=new URLSearchParams(raw);const accessLink=params.get("access_link");if(accessLink){try{const parsed=new URL(accessLink),base=new URL(SUPABASE_URL),redirect=parsed.searchParams.get("redirect_to");if(parsed.origin!==base.origin||!parsed.pathname.startsWith("/auth/v1/verify")||(redirect&&new URL(redirect).origin!==location.origin))throw new Error("Neispravan pristupni link.");location.replace(parsed.href);return true}catch(error){show($("login-status"),error.message,true);return true}}const accessToken=params.get("access_token"),refreshToken=params.get("refresh_token");if(accessToken){localStorage.setItem("lk023-client-session",JSON.stringify({access_token:accessToken,refresh_token:refreshToken||"",token_type:params.get("token_type")||"bearer",expires_in:Number(params.get("expires_in")||3600),expires_at:Number(params.get("expires_at")||0)}));history.replaceState(null,"",location.pathname+location.search);return true}return false}$("logout").addEventListener("click",()=>{localStorage.removeItem("lk023-client-session");location.reload()});const brandedAccessHandled=consumeBrandedAccess();if(!brandedAccessHandled&&localStorage.getItem("lk023-client-session"))load();
</script></body></html>
