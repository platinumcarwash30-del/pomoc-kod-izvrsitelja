name: Import complete original site source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand source archive
        run: |
          if [ ! -f site-source-clean.zip ]; then
            echo "No source archive found; nothing to import."
            exit 0
          fi
          unzip -q site-source-clean.zip -d .
          rm -f site-source-clean.zip .github/workflows/import-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand complete original site source"
          git push
